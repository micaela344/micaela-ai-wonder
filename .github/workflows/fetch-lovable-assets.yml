name: Copiar fotos y videos de Lovable al repo

on:
  workflow_dispatch:
  push:
    branches: [migracion-netlify]
    paths:
      - .github/workflows/fetch-lovable-assets.yml
      - scripts/fetch-lovable-assets.mjs

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-netlify
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-lovable-assets.mjs
      - name: Guardar archivos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/__l5e
          git diff --cached --quiet && exit 0
          git commit -m "Copiar fotos y videos de Lovable a public/"
          git push origin HEAD:migracion-netlify
